# XcodeGen spec: `xcodegen generate` writes Magpie.xcodeproj from this file,
# so the project itself never has to live in git. Build steps: docs/IOS.md.
name: Magpie
options:
  bundleIdPrefix: io.github.munzzyy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The same app/ the website and the Android wrapper ship, bundled as a
      # folder reference so every file rides along unmodified.
      - path: ../app
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Magpie
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Magpie encrypts every entry (AES-256-GCM via WebCrypto, keyed from
        # a PBKDF2-derived passphrase). That is standard, publicly available
        # algorithm use through the OS's own crypto library, which is the
        # exemption this flag claims, not an absence of encryption.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.munzzyy.magpie
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
